<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle · Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2416501007.css">
</head>
<body>
  <header>
    <h1>Etkinlik Güncelle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
      <a href="etkinlik-guncelle.html" aria-current="page">Güncelle</a>
    </nav>
  </header>

  <main>
    <form class="form" action="#" method="post">
      <label for="ad">Etkinlik adı</label>
      <input type="text" id="ad" name="ad" maxlength="80" value="Yazılım Kariyer Zirvesi 2026" required>

      <label for="kategori">Kategori</label>
      <select id="kategori" name="kategori" required>
        <option value="">Seçiniz</option>
        <option value="Seminer" selected>Seminer</option>
        <option value="Atölye">Atölye</option>
        <option value="Söyleşi">Söyleşi</option>
        <option value="Yarışma">Yarışma</option>
      </select>

      <label for="tarih">Tarih</label>
      <input type="date" id="tarih" name="tarih" value="2026-10-14" required>

      <label for="saat">Saat</label>
      <input type="time" id="saat" name="saat" value="13:30" required>

      <label for="yer">Yer</label>
      <input type="text" id="yer" name="yer" value="Mühendislik Fakültesi Konferans Salonu" required>

      <label for="kontenjan">Kontenjan</label>
      <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" value="150">

      <label for="aciklama">Açıklama</label>
      <textarea id="aciklama" name="aciklama" rows="4">Sektörde çalışan mezunlarımız yazılım kariyerinde ilk adımları anlatıyor.</textarea>

      <button type="submit">Güncelle</button>
    </form>
  </main>

  <footer>
    <p>Yağız Yıldırmış · 2416501007 · 2026</p>
  </footer>
</body>
</html>
